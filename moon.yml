$schema: './.moon/cache/schemas/project.json'

id: 'workspace'

taskOptions:
  outputStyle: 'stream'
  runFromWorkspaceRoot: true

tasks:
  toolchain:
    toolchain: 'system'
    command: 'noop'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/rust-toolchain.toml'
      - '/nix/flake/default.nix'
      - '/nix/flake/overlays/**/*'
      - '/nix/flake/devShells/baton/**/*'

  cargo_setting:
    toolchain: 'system'
    command: 'noop'
    inputs:
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/.cargo/**/*'
      - '/.config/nextest.toml'

  flake:
    toolchain: 'system'
    command: 'noop'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/**/*.nix'

  vocabulary_program:
    toolchain: 'system'
    command: 'noop'
    deps:
      - target: 'gates_vocabulary_gate:program'
        cacheStrategy: 'hash'
    inputs: []

  vocabulary_sources:
    toolchain: 'system'
    command: 'noop'
    deps:
      - target: 'gates_vocabulary_gate:sources'
        cacheStrategy: 'hash'
    inputs: []

  coverage_program:
    toolchain: 'system'
    command: 'noop'
    deps:
      - target: 'gates_coverage_command_line:program'
        cacheStrategy: 'hash'
    inputs: []

  coverage_sources:
    toolchain: 'system'
    command: 'noop'
    deps:
      - target: 'gates_coverage_command_line:sources'
        cacheStrategy: 'hash'
    inputs: []

  nix/build/format:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.format'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/**/*.nix'
      - '/crates/**/*.wgsl'

  nix/build/statix:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.statix'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/**/*.nix'

  nix/build/deadnix:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.deadnix'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/**/*.nix'

  nix/build/comment:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.comment'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/**/*.nix'
      - '/.claude/hooks/**/*.sh'
      - '/nix/**/*.sh'
      - '/crates/**/*.sh'
      - '/nix/**/*.py'
      - '/crates/**/*.py'

  nix/build/unsafe-code:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.unsafe-code'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/**/*.nix'
      - '/crates/**/*.rs'
      - '/Cargo.toml'
      - '/crates/**/Cargo.toml'

  nix/build/ubiquitous-language:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.ubiquitous-language'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/participle:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.participle'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/gates/vocabulary/gate/src/domain/contexts/**/*'

  nix/build/sibling:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.sibling'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/verb:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.verb'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/unused-term:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.unused-term'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/Cargo.toml'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/rustfmt:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.rustfmt'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/nix/**/*.nix'
      - '/nix/flake/packages/rustfmt/**/*'
      - '/rustfmt.toml'
      - '/crates/**/*'

  nix/build/word:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.word'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/.claude/hooks/**/*'
      - '/.claude/settings.json'
      - '/.vscode/**/*'
      - '/nix/**/*'
      - '/crates/**/*'

  nix/build/signature:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.signature'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/interface:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.interface'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/test:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.test'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/.config/nextest.toml'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/layer:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.layer'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/Cargo.toml'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/adapter:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.adapter'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/Cargo.toml'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/dependencies:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.dependencies'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/Cargo.toml'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/crate-name:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.crate-name'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/**/Cargo.toml'
      - '/crates/**/moon.yml'

  nix/build/pipeline:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.pipeline'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/moon.yml'
      - '/.moon/*.yml'
      - '/.moon/tasks/**/*'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/module:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.module'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/outputs:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.outputs'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/docs/OUTPUTS.md'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/book:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.book'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/nix/**/*.nix'
      - '/crates/**/*'

  nix/build/shell:
    toolchain: 'system'
    command: 'nix build --no-link --print-build-logs .#checks.x86_64-linux.shell'
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/.claude/hooks/**/*'
      - '/.claude/settings.json'
      - '/.vscode/**/*'
      - '/nix/**/*.nix'

  cargo/run/vocabulary/book:
    toolchain: 'system'
    command: 'nix develop --command cargo run --quiet --package gates_vocabulary_gate -- --book'
    deps:
      - target: 'gates_vocabulary_gate:sources'
        cacheStrategy: 'hash'
      - target: '~:toolchain'
        cacheStrategy: 'hash'
      - target: '~:cargo_setting'
        cacheStrategy: 'hash'
    inputs: []
    options:
      cache: false
      runInCI: false

  ci:
    inputs: []
    deps:
      - 'nix/build/format'
      - 'nix/build/statix'
      - 'nix/build/deadnix'
      - 'nix/build/comment'
      - 'nix/build/unsafe-code'
      - 'nix/build/ubiquitous-language'
      - 'nix/build/participle'
      - 'nix/build/sibling'
      - 'nix/build/verb'
      - 'nix/build/unused-term'
      - 'nix/build/rustfmt'
      - 'nix/build/word'
      - 'nix/build/signature'
      - 'nix/build/interface'
      - 'nix/build/test'
      - 'nix/build/layer'
      - 'nix/build/adapter'
      - 'nix/build/dependencies'
      - 'nix/build/crate-name'
      - 'nix/build/pipeline'
      - 'nix/build/module'
      - 'nix/build/outputs'
      - 'nix/build/book'
      - 'nix/build/shell'
