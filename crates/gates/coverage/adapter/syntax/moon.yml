$schema: '../../../../../.moon/cache/schemas/project.json'

id: 'gates_coverage_adapter_syntax'
language: 'rust'
stack: 'systems'
layer: 'library'
tags: ['crate', 'tool', 'infrastructure']

dependsOn:
  - 'gates_coverage_core_source'
  - 'gates_coverage_core_test_boundaries'
  - 'stack_domain_driven_design_core'

tasks:
  cargo/vocabulary:
    deps:
      - target: 'workspace:vocabulary_program'
        cacheStrategy: 'hash'
      - target: 'workspace:toolchain'
        cacheStrategy: 'hash'
      - target: 'workspace:cargo_setting'
        cacheStrategy: 'hash'
    options:
      mergeDeps: 'replace'

  nix/build/vocabulary:
    deps:
      - target: 'workspace:vocabulary_sources'
        cacheStrategy: 'hash'
      - target: 'workspace:flake'
        cacheStrategy: 'hash'
      - target: 'workspace:cargo_setting'
        cacheStrategy: 'hash'
    options:
      mergeDeps: 'replace'
